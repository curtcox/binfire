name: binfire
description: "binfire: a mobile player for Fragment Kit apps."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  app_links: ^7.0.0
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  http: ^1.6.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/binfire/
