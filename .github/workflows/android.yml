name: android
on:
  push:
    paths: [android/**, shared/**, spec/**, config/**, .github/workflows/android.yml]
  pull_request:
    paths: [android/**, shared/**, spec/**, config/**, .github/workflows/android.yml]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: cd android && ./gradlew :core:test :transfer:test :app:assembleDebug
