name: flutter
on:
  push:
    paths: [flutter/**, shared/**, spec/**, config/**, .github/workflows/flutter.yml]
  pull_request:
    paths: [flutter/**, shared/**, spec/**, config/**, .github/workflows/flutter.yml]
jobs:
  test-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd flutter && flutter pub get && flutter analyze && flutter test
      - run: cd flutter && flutter build apk --debug
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd flutter && flutter build ios --simulator --no-codesign
