name: Binfire
options:
  bundleIdPrefix: app.binfire
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BinfireCore:
    path: BinfireCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Binfire:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: App/Resources
        optional: true
        type: folder
    dependencies:
      - package: BinfireCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: binfire
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.binfire.ios
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  Binfire:
    build:
      targets:
        Binfire: all
    test:
      targets:
        - package: BinfireCore/BinfireCoreTests
