name: Binfire
options:
  bundleIdPrefix: app.binfire
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BinfireCore:
    path: BinfireCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Binfire:
    type: application
    platform: iOS
    sources:
      - App/Sources
      # Individual files, copied to the bundle root. (A folder reference named
      # "Resources" makes CFBundle treat the .app as an old-style bundle, and
      # the simulator then can't read its bundle ID.)
      - path: App/Resources
        optional: true
        buildPhase: resources
    dependencies:
      - package: BinfireCore
      - target: BinfireShare
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: binfire
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Plain http only to localhost (the DEBUG mock HashBin, spec/hashbin.md).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # >>> binfire:configure info-properties
        CFBundleURLTypes:
          - CFBundleURLName: binfire
            CFBundleURLSchemes: [binfire, app.binfire.ios]
        CFBundleDocumentTypes:
          - CFBundleTypeName: binfire bundle
            LSHandlerRank: Owner
            LSItemContentTypes: [app.binfire.bundle]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.binfire.bundle
            UTTypeDescription: binfire bundle
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [binfire]
              public.mime-type: [application/vnd.binfire.bundle]
        LSSupportsOpeningDocumentsInPlace: false
        # <<< binfire:configure info-properties
    entitlements:
      path: App/Binfire.entitlements
      properties:
        # >>> binfire:configure entitlements
        com.apple.developer.associated-domains:
          - applinks:binfire.app
          - webcredentials:binfire.app
        # <<< binfire:configure entitlements
    settings:
      base:
        # >>> binfire:configure target-settings
        PRODUCT_BUNDLE_IDENTIFIER: app.binfire.ios
        # <<< binfire:configure target-settings
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  BinfireShare:
    # Share Extension: hands shared URLs/text to the app as S://share#t=<text>.
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - path: App/Resources/binfire.config.json
        buildPhase: resources
    dependencies:
      - package: BinfireCore
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: binfire
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        # >>> binfire:configure share-extension-settings
        PRODUCT_BUNDLE_IDENTIFIER: app.binfire.ios.share
        # <<< binfire:configure share-extension-settings
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  Binfire:
    build:
      targets:
        Binfire: all
    test:
      targets:
        - package: BinfireCore/BinfireCoreTests
