appId: ${APP_ID}
tags: [m2]
---
- launchApp:
    clearState: true
# Use the port's own scheme (its app ID, spec/links.md "Schemes"): several
# ports installed on one device all claim the public binfire:// scheme, and
# Android would show an "Open with" chooser.
- openLink:
    link: "${APP_ID}://a/python#AAAAAAAFaGVsbG8"
# iOS 26 asks "Open in “binfire”?" before delivering a custom-scheme link. The
# library screen behind the alert has its own Open button, so tap the alert's
# button by its position below the alert title.
- runFlow:
    when:
      visible: "Open in .*"
    commands:
      - tapOn:
          text: "Open"
          below:
            text: "Open in .*"
- assertVisible:
    id: web.view
- assertVisible:
    id: web.title
    text: ".*Python.*"
