# M3: native Save to HashBin against tools/mock-hashbin.mjs. The test document
# is longer than 64 bytes, so its CID is hashed and loading it really fetches.
# Needs: `node tools/mock-hashbin.mjs 8787` on the host; on Android also
# `adb reverse tcp:8787 tcp:8787`. iOS/Android read the overrides from these
# launch arguments (debug builds only); Flutter and React Native builds must be
# made with the compile-time overrides (spec/hashbin.md "Development").
appId: ${APP_ID}
tags: [m3]
---
- runFlow: ../subflows/launch-clean-mock.yaml
- tapOn:
    id: open.input
- inputText: "https://python.hashbin.page/#v1.EQBwTglgdgLgFAHWAZwIYDcCmATABAIwE8DoAzCMTAGlwBsB7KAc10ynoFcmALXGb1DFwQYyXAGEAkgBFhYgcm44a7IdFrRMSAJTAgA"
- tapOn:
    id: open.go
- assertVisible:
    id: web.view
- tapOn:
    id: web.send
- tapOn:
    id: send.hashbin
- assertVisible:
    id: hashbin.confirm
- tapOn:
    id: hashbin.ok
# iOS asks before ASWebAuthenticationSession opens ("… Wants to Use … to Sign
# In"), and the prompt can appear late, so keep checking until the result shows.
# (Android: the Custom Tab must not be stuck on Chrome's first-run screen.)
- repeat:
    while:
      notVisible:
        id: hashbin.result
    times: 10
    commands:
      - tapOn:
          text: "Continue"
          optional: true
- assertVisible:
    id: hashbin.result
- assertVisible:
    id: hashbin.link
    text: ".*binfire.app/c.*"
