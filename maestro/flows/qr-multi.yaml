appId: ${APP_ID}
tags: [m4]
---
# A state over 2953 link bytes has no single QR (plan "too-long"): the sheet
# offers Multi-frame QR, which cycles BF1: frames with a counter.
- runFlow: ../subflows/launch-clean.yaml
- openLink:
    link: "${APP_ID}://a/python#"
- runFlow:
    when:
      visible: "Open in .*"
    commands:
      - tapOn:
          text: "Open"
          below:
            text: "Open in .*"
- assertVisible: {id: web.view}
- tapOn: {id: web.send}
- tapOn: {id: send.qr}
- assertVisible: {id: qr.sheet}
- assertVisible: {id: qr.note}
- assertNotVisible: {id: qr.image}
- tapOn: {id: qr.multi}
- assertVisible: {id: qr.frames}
- assertVisible: {id: qr.frameIndex, text: "\\d+/\\d+"}
